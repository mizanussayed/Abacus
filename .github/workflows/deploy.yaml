name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        dotnet-version: 10.0.x

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
        
    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore Dependency
      run: dotnet restore
      working-directory: ./Abacus
      
    - name: Build
      run: dotnet build -c Release -f net10.0-android
      working-directory: ./Abacus

    # - name: Decode Signing Certificate
    #   run: |
    #     echo "${{ secrets.SIGNING_CERTIFICATE_BASE_64_CONTENT }}" > cert.asc
    #     certutil -decode cert.asc cert.pfx

    # - name: Install Signing Certficiate
    #   run: certutil -user -p ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }} -Silent -importpfx cert.pfx NoRoot

    - name: Publish
      run: dotnet publish -c Release -f net10.0-android --self-contained -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:PublishTrimmed=true -o ./Abacus/bin/Release/net10.0-android/AppPackages/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_Prod
      working-directory: ./Abacus   

    - name: Extract Version
      id: extractVersion
      shell: pwsh
      run: |
        $xml = [Xml] (Get-Content ./Abacus/Abacus.csproj)
        [string] $version = [Version] $xml.Project.PropertyGroup.ApplicationDisplayVersion
        echo "version=$($version)" >> $env:GITHUB_OUTPUT

    - name: Create Tag
      uses: actions/github-script@v5
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            ref: 'refs/tags/v${{ steps.extractVersion.outputs.version }}'
          })

    - name: Rename Auto-Update Installer
      shell: pwsh
      run: Rename-Item ./Abacus/bin/Release/net10.0-android/AppPackages/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_Prod/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_x64.apk AutoUpdate.apk

    - name: Rename Certificate
      shell: pwsh
      run: Rename-Item ./Abacus/bin/Release/net10.0-android/AppPackages/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_Prod/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_x64.cer AbacusDeploy.cer
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.extractVersion.outputs.version }}
        files: | 
          ./Abacus/bin/Release/net10.0-android/AppPackages/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_Prod/AutoUpdate.apk
          ./Abacus/bin/Release/net10.0-android/AppPackages/AbacusDeploy_${{ steps.extractVersion.outputs.version }}.0_Prod/AbacusDeploy.cer
