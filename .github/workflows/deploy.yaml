name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      # - name: Install MAUI Workload
      #   run: dotnet workload install maui

      # - name: Restore Dependencies
      #   run: dotnet restore ./Abacus

      # Generate a new keystore in CI
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ./Abacus/abacus.keystore \
            -alias abacus-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ secrets.SIGNING_KEY_PASSWORD }} \
            -keypass ${{ secrets.SIGNING_KEY_PASSWORD }} \
            -dname "CN=Abacus, OU=DevOps, O=MyCompany, L=Dhaka, S=Dhaka, C=BD"
        shell: bash

      - name: get keystore code
        run: cat ./Abacus/abacus.keystore

